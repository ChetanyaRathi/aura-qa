name: AuraQA

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly run at 06:00 UTC (monitoring)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run self-healing suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python cli.py heal --suite tests_store/example_suite.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auraqa-report
          path: reports/
